#bc-quiz .bcq-rate { background: #fff; border: 2px solid #000; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--bcq-shadow); }

/* Skala (Rhythmus, Akkorde) */

#bc-quiz .bcq-kicker { display: block; font-family: var(--bcq-body) !important; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--bcq-muted); margin-bottom: 4px; }

      var segs = [0, 1, 2, 3, 4].map(function (n) { return '<span class="' + (n <= lv ? "on" : "") + '"></span>'; }).join("");
      return '<div class="bcq-prow"><div class="bcq-prow-name">' + esc(SHORT[k]) + tags + '</div><div class="bcq-prow-lvl">' + PLEVELS[lv] + '</div>' +
        '<div class="bcq-bar l' + (lv <= 1 ? 0 : (lv === 2 ? 1 : 2)) + '" aria-hidden="true">' + segs + '</div></div>';
    }).join("");
    return '<div class="bcq-step"><div class="bcq-profile"><div class="bcq-profile-head"><div class="bcq-label">Wo du gerade stehst</div><p class="bcq-small">So steht dein Spiel gerade in den Bereichen, auf die es jetzt ankommt.</p></div>' + rows + '</div></div>';
  }

  function renderResult() {
    var a = state.answers, r = evaluate(a), c = COURSES[r.course];
    var meta = function (x) { return x.lessons + " Lektionen"; };
    var all = [r.course].concat(r.follow.map(function (f) { return f.c; }));
    var bonusHtml = "";
    if (r.bonus.length) {
      var names = r.bonus.map(function (k) { return BONUS[k]; });
      bonusHtml = '<p class="bcq-bonus">' + (names.length > 1
        ? "Passend zu deinen Lücken: " + names.join(" und ") + " sind in der Groove Akademie mit drin."
        : "Passend zu deiner Lücke: " + names[0] + " ist in der Groove Akademie mit drin.") + '</p>';
    }
    var followHtml = r.follow.map(function (f, i) {
      return '<div class="bcq-step"><div class="bcq-label">Danach, Schritt ' + (i + 2) + '</div><div class="bcq-blk">' + card(COURSES[f.c], meta(COURSES[f.c])) + '<div class="bcq-blk-txt"><p>' + esc(f.why) + '</p></div></div></div>';
    }).join("");
    var names = all.map(function (k) { return COURSES[k].name; });
    app.innerHTML =
      '<section class="bcq-result">' +
      '<div class="bcq-thread">' +
      '<div class="bcq-head"><h1>Dein roter Faden am E-Bass</h1></div>' +
      profileHtml(r) +
      '<div class="bcq-path">' +
      '<div class="bcq-step"><div class="bcq-label">Starte hier</div><div class="bcq-blk bcq-blk-big">' + card(c, meta(c), true) +
        '<div class="bcq-blk-txt bcq-why"><h3>Darum passt der Kurs gerade zu dir</h3><ul class="bcq-learn">' + reasons(a, r).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></div>' +
      '</div></div>' +
      followHtml +
      '</div>' +
      '<p style="text-align:center"><button type="button" class="bcq-again" id="bcq-again"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg><span>Quiz wiederholen</span></button></p>' +
      '</section>';
    root.setAttribute("data-path", all.join(">"));
    document.getElementById("bcq-again").addEventListener("click", function () { state = { step: 0, answers: {}, started: true }; render(); });
  }

  render();
})();
</script>
</body>
</html>
